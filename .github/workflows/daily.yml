name: daily-post

on:
  schedule:
    # 월~토 07:00 KST = UTC 일~금 22:00. 일요일(KST)은 새 시장 데이터가 없어 쉰다.
    # GitHub 사정으로 수십 분 늦어질 수 있음
    - cron: "0 22 * * 0-5"
    # 경제 공부 글: 수·토 08:00 KST = UTC 화·금 23:00 (settings.yaml guide.weekdays 와 맞춘다)
    - cron: "0 23 * * 2,5"
  workflow_dispatch:
    inputs:
      date:
        description: "기준 날짜 YYYY-MM-DD (비우면 오늘, KST)"
        required: false
      dry_run:
        description: "샘플 데이터로 실행 (외부 API 호출 없음)"
        type: boolean
        default: false
      mode:
        description: "run = 시황 글(+인스타 카드), cards = 인스타 카드만 메일로, guide = 경제 공부 글, classify = 수집·분류만 점검, insta-check = 인스타 토큰 점검, insta-post = source_run 의 카드를 그대로 인스타에 게시"
        type: choice
        options: [run, cards, guide, classify, insta-check, insta-post]
        default: run
      topic:
        description: "guide 일 때 주제 아이디 (config/guides.yaml, 비우면 오늘 차례)"
        required: false
      source_run:
        description: "insta-post 일 때 게시할 카드를 만든 실행 번호 (Actions 실행 주소 끝의 숫자)"
        required: false
      account:
        description: "insta-post 일 때 게시할 계정 (kr, en)"
        required: false
        default: kr

permissions:
  contents: read
  actions: read   # insta-post: 이전 실행의 카드(artifact) 내려받기

concurrency:
  group: daily-post
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 한글 폰트 설치
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-nanum fonts-noto-cjk fonts-noto-cjk-extra
          rm -rf ~/.cache/matplotlib

      - name: 의존성 설치
        run: pip install -e .

      - name: 게시할 카드 받기 (insta-post)
        if: inputs.mode == 'insta-post'
        uses: actions/download-artifact@v4
        with:
          name: draft-${{ inputs.source_run }}
          run-id: ${{ inputs.source_run }}
          github-token: ${{ github.token }}
          path: output/

      - name: 초안 생성
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LAYA_API_KEY: ${{ secrets.LAYA_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          CHARTS_REPO_TOKEN: ${{ secrets.CHARTS_REPO_TOKEN }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          INSTAGRAM_EN_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_EN_ACCESS_TOKEN }}
          INSTAGRAM_EN_USER_ID: ${{ secrets.INSTAGRAM_EN_USER_ID }}
        run: |
          if [ "${{ inputs.mode }}" = "classify" ]; then
            python -m econblog -v classify
            exit 0
          fi
          if [ "${{ inputs.mode }}" = "insta-check" ]; then
            python -m econblog insta-check
            exit $?
          fi
          if [ "${{ inputs.mode }}" = "insta-post" ]; then
            python -m econblog -v insta-post --account "${{ inputs.account }}"
            exit $?
          fi
          args=""
          if [ -n "${{ inputs.date }}" ]; then args="$args --date ${{ inputs.date }}"; fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then args="$args --dry-run --deliver local,email"; fi
          if [ "${{ github.event.schedule }}" = "0 23 * * 2,5" ]; then
            python -m econblog guide --scheduled $args
          elif [ "${{ inputs.mode }}" = "guide" ]; then
            if [ -n "${{ inputs.topic }}" ]; then
              python -m econblog guide --topic "${{ inputs.topic }}" $args
            else
              python -m econblog guide --scheduled $args
            fi
          elif [ "${{ inputs.mode }}" = "cards" ]; then
            python -m econblog run --cards-only $args
          else
            python -m econblog run $args
          fi

      # 메일이 안 왔을 때 대비용. 레포가 public 이면 로그인한 누구나 받을 수 있으므로 보관 기간을 짧게 둔다.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: draft-${{ github.run_id }}
          path: output/
          retention-days: 3
          if-no-files-found: ignore
