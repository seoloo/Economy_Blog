name: daily-post

on:
  schedule:
    # 화~토 아침 (KST) = UTC 월~금. 출근길(8시 전)에 볼 수 있게 미국 마감(겨울 06:00 KST) 직후 시작한다.
    # GitHub 예약은 정각·30분에 몰려 늦어지거나 빠진다 (11/10 07:00 누락, 11/11 06:30 은 13분 넘게 시작 안 함).
    # 그래서 한가한 분(分)에 세 번 걸어 둔다. 먼저 끝난 실행이 있으면 나머지는 바로 멈춘다.
    # 일·월요일(KST) 아침은 토요일 이후 새로 열린 장이 없어 쉰다.
    - cron: "13 21 * * 1-5"   # 06:13 KST
    - cron: "28 21 * * 1-5"   # 06:28 KST (예비)
    - cron: "47 21 * * 1-5"   # 06:47 KST (예비)
    # 경제 공부 글: 수·토 08:07 KST = UTC 화·금 23:07 (settings.yaml guide.weekdays 와 맞춘다)
    - cron: "7 23 * * 2,5"
  workflow_dispatch:
    inputs:
      date:
        description: "기준 날짜 YYYY-MM-DD (비우면 오늘, KST)"
        required: false
      dry_run:
        description: "샘플 데이터로 실행 (외부 API 호출 없음)"
        type: boolean
        default: false
      mode:
        description: "run = 시황 글(+인스타 카드), cards = 인스타 카드만 메일로, guide = 경제 공부 글, classify = 수집·분류만 점검, insta-check = 인스타 토큰 점검, insta-edit = source_run 의 카드 문장을 고쳐 다시 찍기, insta-post = source_run 의 카드를 그대로 인스타에 게시(릴스 포함), insta-reel = source_run 의 카드로 릴스만 만들어 게시, insta-intro = source_run 의 카드를 예시로 계정 소개 게시물 만들기, naver-mail = source_run 초안의 네이버판을 메일로 다시 보내기"
        type: choice
        options: [run, cards, guide, classify, insta-check, insta-edit, insta-post, insta-reel, insta-intro, naver-mail]
        default: run
      topic:
        description: "guide 일 때 주제 아이디 (config/guides.yaml, 비우면 오늘 차례)"
        required: false
      source_run:
        description: "insta-post 일 때 게시할 카드를 만든 실행 번호 (Actions 실행 주소 끝의 숫자)"
        required: false
      account:
        description: "insta-edit·insta-post 일 때 계정 (kr, en)"
        required: false
        default: kr
      edits:
        description: 'insta-edit 일 때 고칠 문장 JSON: [["찾을 문장", "바꿀 문장"], ...]'
        required: false
      publish:
        description: "run·cards 일 때 인스타에 바로 올리기 (끄면 카드만 만들어 메일로 보내고, 확인 후 insta-post 로 올린다)"
        type: boolean
        default: true

permissions:
  contents: read
  actions: read   # insta-post: 이전 실행의 카드(artifact) 내려받기

concurrency:
  group: daily-post
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 한글 폰트 설치
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-nanum fonts-noto-cjk fonts-noto-cjk-extra ffmpeg
          rm -rf ~/.cache/matplotlib

      - name: 의존성 설치
        run: pip install -e .

      # insta-intro 는 예시로 쓸 카드를 examples/ 에 받는다. output/ 에 받으면 소개 게시물과 섞여
      # 나중에 insta-post 가 이미 올린 카드를 다시 올릴 수 있다.
      - name: 만들어 둔 카드 받기 (insta-edit, insta-post, insta-intro)
        if: inputs.mode == 'insta-post' || inputs.mode == 'insta-edit' || inputs.mode == 'insta-reel' || inputs.mode == 'insta-intro' || inputs.mode == 'naver-mail'
        uses: actions/download-artifact@v4
        with:
          name: draft-${{ inputs.source_run }}
          run-id: ${{ inputs.source_run }}
          github-token: ${{ github.token }}
          path: ${{ inputs.mode == 'insta-intro' && 'examples/' || 'output/' }}

      - name: 초안 생성
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LAYA_API_KEY: ${{ secrets.LAYA_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          CHARTS_REPO_TOKEN: ${{ secrets.CHARTS_REPO_TOKEN }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          INSTAGRAM_EN_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_EN_ACCESS_TOKEN }}
          INSTAGRAM_EN_USER_ID: ${{ secrets.INSTAGRAM_EN_USER_ID }}
          CARD_EDITS: ${{ inputs.edits }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # 아침 예약은 두 번 걸어 둔다. 오늘(UTC) 이미 성공한 아침 예약 실행이 있으면 이번 것은 건너뛴다.
          if [ "${{ github.event_name }}" = "schedule" ] && [ "${{ github.event.schedule }}" != "7 23 * * 2,5" ]; then
            done_today=$(gh run list -R "$GITHUB_REPOSITORY" --workflow daily.yml --event schedule --status success               --created ">=$(date -u +%F)" --json databaseId,displayTitle --jq '[.[] | select(.databaseId != ${{ github.run_id }})] | length')
            if [ "${done_today:-0}" -gt 0 ]; then echo "오늘 아침 실행이 이미 끝나서 건너뜀"; exit 0; fi
          fi
          if [ "${{ inputs.mode }}" = "classify" ]; then
            python -m econblog -v classify
            exit 0
          fi
          if [ "${{ inputs.mode }}" = "insta-check" ]; then
            python -m econblog insta-check
            exit $?
          fi
          if [ "${{ inputs.mode }}" = "insta-edit" ]; then
            python -m econblog -v insta-edit --account "${{ inputs.account }}"
            exit $?
          fi
          if [ "${{ inputs.mode }}" = "insta-post" ]; then
            python -m econblog -v insta-post --account "${{ inputs.account }}"
            exit $?
          fi
          if [ "${{ inputs.mode }}" = "insta-reel" ]; then
            python -m econblog -v insta-reel --account "${{ inputs.account }}" --post
            exit $?
          fi
          if [ "${{ inputs.mode }}" = "naver-mail" ]; then
            python -m econblog -v naver-mail
            exit $?
          fi
          if [ "${{ inputs.mode }}" = "insta-intro" ]; then
            python -m econblog -v insta-intro --account "${{ inputs.account }}" --examples examples --deliver local,email
            exit $?
          fi
          args=""
          if [ -n "${{ inputs.date }}" ]; then args="$args --date ${{ inputs.date }}"; fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then args="$args --dry-run --deliver local,email"; fi
          if [ "${{ inputs.publish }}" = "false" ]; then pub="--no-publish"; else pub=""; fi
          if [ "${{ github.event.schedule }}" = "7 23 * * 2,5" ]; then
            python -m econblog guide --scheduled $args
          elif [ "${{ inputs.mode }}" = "guide" ]; then
            if [ -n "${{ inputs.topic }}" ]; then
              python -m econblog guide --topic "${{ inputs.topic }}" $args
            else
              python -m econblog guide --scheduled $args
            fi
          elif [ "${{ inputs.mode }}" = "cards" ]; then
            python -m econblog run --cards-only $pub $args
          else
            python -m econblog run $pub $args
          fi

      # 메일이 안 왔을 때 대비용. 레포가 public 이면 로그인한 누구나 받을 수 있으므로 보관 기간을 짧게 둔다.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: draft-${{ github.run_id }}
          path: output/
          retention-days: 3
          if-no-files-found: ignore
