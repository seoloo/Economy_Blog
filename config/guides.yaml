# 경제 공부 글(오래 읽히는 개념 설명) 주제 목록. 위에서부터 순서대로 쓴다.
# 주제 추가는 이 파일 맨 아래에 한 항목만 붙이면 된다. 순서를 바꾸면 자동 실행 순서도 바뀐다.
# keyword 는 사람들이 실제로 검색하는 말로 쓴다 (예: "반대매매 뜻", "미국 주식 거래시간").
#
#  id:       파일 이름에 쓰는 영문 아이디 (바꾸지 않는다)
#  keyword:  검색 키워드. 제목 앞부분과 대표 이미지의 큰 글자로 쓴다.
#  subtitle: 대표 이미지 아래 줄
#  angle:    글에서 꼭 다룰 내용 (LLM 에게 주는 방향)
#  series:   본문 '지금 수치'에 넣을 시장 데이터 (config/series.yaml 의 key)
#  charts:   직접 그려 넣을 장기 차트 (type 은 charts/ 빌더 이름, days 는 기간)

guides:
  - id: yield_curve
    keyword: 장단기 금리차
    subtitle: 금리 역전은 왜 경기침체 신호로 불릴까
    angle: 10년물과 2년물 금리차의 뜻, 평소에는 왜 양수인지, 금리 역전이 무엇이고 왜 침체 신호로 불리는지, 신호의 한계(시차와 예외), 지금 수치 해석, 한국 투자자가 볼 점
    series: [us10y, us2y]
    charts:
      - {key: spread, type: spread, title: 미 국채 10년·2년 금리와 금리차 (최근 5년), series: [us10y, us2y], days: 1825}

  - id: fx_kospi
    keyword: 환율과 코스피
    subtitle: 원/달러 환율이 오르면 주가는 왜 흔들릴까
    angle: 환율 상승(원화 약세)의 뜻, 외국인 투자자의 환차손 관점, 수출주와 내수주에 다른 영향, 둘이 항상 반대로 움직이지는 않는다는 점, 지금 수치 해석
    series: [usdkrw, kospi]
    charts:
      - {key: usdkrw, type: line, title: 원/달러 환율 (최근 5년), series: [usdkrw], days: 1825}
      - {key: kospi, type: line, title: 코스피 (최근 5년), series: [kospi], days: 1825}

  - id: cpi
    keyword: CPI 소비자물가지수
    subtitle: 물가 지표 하나에 증시가 크게 흔들리는 이유
    angle: CPI와 근원 CPI의 차이, 전년 대비와 전월 대비 읽는 법, 발표 시기(매달 중순, 정확한 날짜는 미국 노동통계국 일정 확인), 예상치와 실제치의 차이가 중요한 이유, 금리·주가와의 연결
    series: [us2y, us10y]
    charts:
      - {key: us2y, type: line, title: 미 국채 2년 금리 (최근 5년), series: [us2y], days: 1825}

  - id: fomc
    keyword: FOMC
    subtitle: 미국 금리를 정하는 회의, 언제 무엇을 봐야 할까
    angle: FOMC가 무엇이고 1년에 몇 번 열리는지, 성명서·점도표·기자회견에서 볼 것, 시장이 결정보다 '앞으로의 신호'에 반응하는 이유, 한국 증시와 환율에 미치는 영향. 회의 날짜는 단정하지 말고 연준 일정 확인을 권한다
    series: [us2y, us10y, usdkrw]
    charts:
      - {key: us2y, type: line, title: 정책금리 기대를 반영하는 미 국채 2년 금리 (최근 5년), series: [us2y], days: 1825}

  - id: vix
    keyword: VIX 공포지수
    subtitle: 시장의 불안을 숫자로 보는 법
    angle: VIX가 무엇을 재는지(S&P 500 옵션으로 본 향후 30일 예상 변동성), 수치 구간별 의미, 주가와 반대로 움직이는 경향, 한계, 지금 수치 해석
    series: [vix, sp500]
    charts:
      - {key: vix, type: line, title: VIX 변동성 지수 (최근 5년), series: [vix], days: 1825}

  - id: circuit_breaker
    keyword: 서킷브레이커와 사이드카
    subtitle: 급락장에서 매매가 멈추는 이유
    angle: 서킷브레이커와 사이드카가 무엇이고 왜 있는지, 발동 기준과 단계(확실한 기준만 쓰고 세부는 한국거래소 안내 확인을 권한다), 발동 뒤 시장 흐름, 개인 투자자가 그때 할 일
    series: [kospi, kosdaq]
    charts: []

  - id: margin_call
    keyword: 반대매매 뜻
    subtitle: 신용융자·미수거래와 강제 매도가 일어나는 과정
    angle: 신용융자와 미수거래의 뜻과 차이, 담보 가치가 기준 아래로 내려가면 증권사가 주식을 강제로 파는 반대매매 과정, 급락장에서 반대매매가 하락을 키우는 이유, 반대매매를 피하려면 확인할 것. 담보유지비율 같은 기준 숫자는 증권사마다 다르므로 예시임을 밝히고 본인 계좌 약관 확인을 권한다
    series: [kospi, kosdaq]
    charts: []

  - id: sox
    keyword: 필라델피아 반도체지수
    subtitle: 삼성전자·SK하이닉스 주가와 같이 움직이는 이유
    angle: 필라델피아 반도체지수가 무엇이고 어떤 기업이 들어 있는지(구성 종목은 바뀔 수 있음을 밝힌다), 나스닥보다 크게 움직이는 이유, 다음 날 국내 반도체주와 코스피에 주는 영향, 항상 같이 움직이지는 않는 이유, 지금 수치 해석
    series: [sox, nasdaq, kospi]
    charts:
      - {key: sox, type: line, title: 필라델피아 반도체지수 (최근 5년), series: [sox], days: 1825}

  - id: stabilization_fund
    keyword: 증시안정펀드 뜻
    subtitle: 증안펀드는 급락장에서 어떤 역할을 할까
    angle: 증시안정펀드(증안펀드)가 무엇이고 누가 돈을 내는지, 급락장에서 지수를 받치는 방식, 실제 효과와 한계. 과거 조성·투입 사례와 금액은 확실한 것만 쓰고, 확실하지 않으면 숫자를 쓰지 않는다. 지금 투입 여부는 단정하지 않고 금융당국 발표 확인을 권한다
    series: [kospi, kosdaq]
    charts: []

  - id: us10y
    keyword: 미국 10년물 국채 금리
    subtitle: 전 세계 자산 가격의 기준이 되는 금리
    angle: 10년물 금리가 왜 기준 금리처럼 쓰이는지, 성장주·부동산·환율에 주는 영향, 오르는 이유와 내리는 이유, 지금 수치 해석
    series: [us10y]
    charts:
      - {key: us10y, type: line, title: 미 국채 10년 금리 (최근 5년), series: [us10y], days: 1825}

  - id: dollar_index
    keyword: 달러인덱스
    subtitle: 달러가 강한지 약한지 한 번에 보는 지표
    angle: 달러인덱스의 뜻과 구성 통화(유로 비중이 크다는 점), 원/달러 환율과의 관계, 달러 강세가 신흥국·원자재에 주는 영향, 지금 수치 해석
    series: [dxy, usdkrw]
    charts:
      - {key: dxy, type: line, title: 달러인덱스 (최근 5년), series: [dxy], days: 1825}

  - id: kr_base_rate
    keyword: 한국은행 기준금리
    subtitle: 금통위 결정이 대출과 주식에 미치는 영향
    angle: 기준금리의 뜻, 금융통화위원회가 무엇을 보고 정하는지, 시중 금리·대출·예금으로 퍼지는 과정, 미국 금리와의 차이가 환율에 주는 영향, 지금 수치 해석
    series: [kr_base_rate, kr3y]
    charts:
      - {key: kr_rates, type: line, title: 한국은행 기준금리와 국고채 3년 금리 (최근 5년), series: [kr_base_rate, kr3y], days: 1825}

  - id: jobs_report
    keyword: 미국 고용지표
    subtitle: 비농업 고용 발표에 시장이 숨죽이는 이유
    angle: 비농업 고용·실업률·임금상승률이 무엇인지, 발표 시기(보통 매달 첫 금요일, 정확한 날짜는 노동통계국 일정 확인), 고용이 좋으면 오히려 주가가 내리기도 하는 이유, 금리와의 연결
    series: [us2y]
    charts: []

  - id: us_indices
    keyword: S&P 500 나스닥 다우 차이
    subtitle: 미국 3대 지수는 무엇이 다를까
    angle: 세 지수의 구성 방식(시가총액 가중과 가격 가중)과 대표 종목 성격, 같은 날 다르게 움직이는 이유, 투자자가 주로 보는 지수
    series: [sp500, nasdaq, dow]
    charts:
      - {key: sp500, type: line, title: S&P 500 (최근 5년), series: [sp500], days: 1825}

  - id: kospi_kosdaq
    keyword: 코스피 코스닥 차이
    subtitle: 두 시장은 무엇이 다르고 어떻게 움직일까
    angle: 상장 기업의 성격 차이, 업종 구성(반도체·바이오 등), 변동성 차이, 개인과 외국인 비중 차이, 지금 수치 해석
    series: [kospi, kosdaq]
    charts:
      - {key: kosdaq, type: line, title: 코스닥 (최근 5년), series: [kosdaq], days: 1825}

  - id: foreign_flow
    keyword: 외국인 순매수 보는 법
    subtitle: 외국인 수급으로 코스피 방향을 읽을 수 있을까
    angle: 외국인·기관·개인 순매수의 뜻, 외국인 수급이 코스피에 중요한 이유, 환율과의 관계, 하루 수치만 보면 안 되는 이유. 수급 수치는 데이터가 없으므로 지어내지 않는다
    series: [kospi, usdkrw]
    charts: []

  - id: leverage_etf
    keyword: 레버리지 ETF 위험
    subtitle: 지수가 제자리여도 손실이 나는 이유
    angle: 레버리지 ETF가 하루 수익률의 배수를 따른다는 점, 오르내림이 반복될 때 생기는 손실을 간단한 가상 숫자 예시로 설명(예시임을 밝힌다), 장기 보유의 위험, 확인할 점
    series: [nasdaq]
    charts: []

  - id: oil
    keyword: WTI 브렌트유 차이
    subtitle: 국제유가가 물가와 증시에 주는 영향
    angle: WTI와 브렌트유의 차이, 유가를 움직이는 요인(수요·공급·지정학), 유가가 물가와 금리, 업종별 주가에 주는 영향, 지금 수치 해석
    series: [wti]
    charts:
      - {key: wti, type: line, title: WTI 유가 (최근 5년), series: [wti], days: 1825}

  - id: gold
    keyword: 금값 오르는 이유
    subtitle: 금리·달러와 금의 관계
    angle: 금이 안전자산으로 불리는 이유, 실질금리와 달러가 금값에 주는 영향, 중앙은행 매수 같은 다른 요인, 지금 수치 해석
    series: [gold, dxy, us10y]
    charts:
      - {key: gold, type: line, title: 금 가격 (최근 5년), series: [gold], days: 1825}

  - id: bond_price
    keyword: 금리와 채권 가격 관계
    subtitle: 금리가 오르면 채권 가격은 왜 떨어질까
    angle: 채권 가격과 금리가 반대로 움직이는 이유를 쉬운 숫자 예시로(예시임을 밝힌다), 만기가 길수록 더 크게 움직이는 이유, 채권 투자와 금리 전망의 관계, 지금 수치 해석
    series: [us10y, kr3y]
    charts: []

  - id: per_pbr
    keyword: PER PBR 뜻
    subtitle: 주식이 비싼지 싼지 가늠하는 기본 지표
    angle: PER과 PBR의 뜻과 계산, 업종마다 적정 수준이 다른 이유, 낮다고 무조건 싼 것은 아닌 이유, 같이 보면 좋은 지표
    series: []
    charts: []

  - id: earnings_season
    keyword: 실적 시즌 보는 법
    subtitle: EPS와 가이던스, 무엇이 주가를 움직일까
    angle: 실적 시즌이 언제인지(분기 마감 뒤 약 한 달), EPS·매출·가이던스의 뜻, 예상치 대비가 중요한 이유, 실적이 좋아도 주가가 내리는 이유
    series: [sp500, nasdaq]
    charts: []

  - id: nikkei
    keyword: 닛케이 지수와 코스피
    subtitle: 일본 증시가 한국 증시에 주는 신호
    angle: 닛케이225가 무엇인지, 엔화와 일본 증시의 관계, 한국 증시와 같이 또는 다르게 움직이는 이유, 지금 수치 해석
    series: [nikkei, kospi]
    charts:
      - {key: nikkei, type: line, title: 닛케이225 (최근 5년), series: [nikkei], days: 1825}

  - id: us_trading_hours
    keyword: 미국 주식 거래시간
    subtitle: 서머타임과 프리마켓·애프터마켓 한국 시간 정리
    angle: 미국 정규장 시간(현지 09:30~16:00)과 한국 시간(서머타임 때 22:30~05:00, 아닐 때 23:30~06:00), 서머타임이 시작하고 끝나는 시기(3월 둘째 일요일~11월 첫째 일요일), 프리마켓과 애프터마켓의 뜻과 주의할 점(거래량이 적어 가격이 크게 움직임), 휴장일은 거래소 일정 확인을 권한다. 증권사별 주문 가능 시간은 다르므로 확인을 권한다
    series: [sp500, nasdaq]
    charts: []

  - id: etf_basics
    keyword: ETF 뜻과 고르는 법
    subtitle: 총보수·추적오차·거래량, 무엇을 봐야 할까
    angle: ETF가 무엇이고 펀드·개별 주식과 어떻게 다른지, 고를 때 볼 것(기초지수, 총보수, 추적오차, 거래량, 괴리율)을 하나씩 쉬운 말로, 같은 지수를 따르는 ETF끼리 비교하는 법. 특정 상품을 권하지 않는다
    series: [sp500]
    charts: []

  - id: hedged_etf
    keyword: 환헤지 ETF 차이
    subtitle: 이름 끝 (H)는 무슨 뜻이고 언제 유리할까
    angle: 환노출과 환헤지의 뜻, 이름 끝 (H) 표시, 환율이 오를 때와 내릴 때 두 상품의 수익이 어떻게 달라지는지 간단한 가상 숫자 예시로(예시임을 밝힌다), 환헤지에 비용이 든다는 점, 지금 환율 수치 해석. 어느 쪽이 낫다고 단정하지 않는다
    series: [usdkrw, sp500]
    charts:
      - {key: usdkrw, type: line, title: 원/달러 환율 (최근 5년), series: [usdkrw], days: 1825}

  - id: short_selling
    keyword: 공매도 뜻
    subtitle: 주식을 빌려서 파는 거래는 왜 논란이 될까
    angle: 공매도의 구조(빌려서 팔고 나중에 사서 갚는다), 주가가 내리면 이익·오르면 손실인 이유, 숏커버링의 뜻, 순기능과 비판을 모두 다룬다. 제도·기준 숫자는 확실한 것만 쓰고, 바뀔 수 있으니 금융위원회·한국거래소 안내 확인을 권한다
    series: [kospi]
    charts: []

  - id: witching_day
    keyword: 네 마녀의 날
    subtitle: 선물옵션 동시만기일에 증시가 흔들리는 이유
    angle: 선물과 옵션의 만기가 겹치는 날이라는 뜻, 한국(3·6·9·12월 둘째 목요일)과 미국(3·6·9·12월 셋째 금요일) 날짜, 만기일 장 막판에 변동성이 커지는 이유, 개인 투자자가 알아 둘 점. 정확한 날짜는 거래소 일정 확인을 권한다
    series: [kospi, sp500]
    charts: []

  - id: market_cap
    keyword: 시가총액 뜻
    subtitle: 주가가 비싸다고 큰 회사가 아닌 이유
    angle: 시가총액의 뜻과 계산(주가×주식 수), 주가만으로 회사 크기를 비교하면 안 되는 이유, 대형주·중형주·소형주 구분, 지수에서 시가총액 비중이 큰 종목이 지수를 움직이는 원리
    series: [kospi]
    charts: []

  - id: rights_offering
    keyword: 유상증자 무상증자 차이
    subtitle: 증자 공시가 나오면 주가는 왜 움직일까
    angle: 유상증자와 무상증자의 뜻과 차이, 유상증자 방식(주주배정·일반공모·제3자배정)에 따라 반응이 다른 이유, 주식 수가 늘어 한 주의 가치가 희석된다는 뜻, 권리락의 뜻, 공시에서 확인할 것(자금 사용 목적)
    series: []
    charts: []

  - id: stock_split
    keyword: 액면분할 뜻
    subtitle: 주식을 쪼개면 회사 가치가 달라질까
    angle: 액면분할과 주식분할의 뜻, 주식 수는 늘고 주가는 낮아지지만 회사 가치는 그대로인 이유를 쉬운 숫자 예시로(예시임을 밝힌다), 그런데도 주가가 반응하는 이유, 액면병합과의 차이
    series: []
    charts: []

  - id: dividend_date
    keyword: 배당락일 배당기준일
    subtitle: 배당을 받으려면 언제까지 사야 할까
    angle: 배당기준일과 배당락일의 뜻, 매수 뒤 결제까지 이틀이 걸려 기준일 이틀 전까지 사야 하는 이유, 배당락일에 주가가 내리는 경향, 배당수익률 보는 법. 배당기준일은 회사마다 다르고 제도가 바뀌어 왔으므로 회사 공시 확인을 권한다
    series: []
    charts: []

  - id: settlement
    keyword: 예수금 D+2 뜻
    subtitle: 주식을 팔았는데 돈이 바로 안 들어오는 이유
    angle: 예수금·증거금·미수금의 뜻, 한국 주식은 매매 뒤 2영업일에 결제된다는 점(D+2), 판 돈으로 바로 다른 주식을 살 수는 있지만 출금은 결제일에 된다는 점, 미수가 생기는 과정과 주의할 점. 미국 주식의 결제일과 증권사별 세부 기준은 증권사 안내 확인을 권한다
    series: []
    charts: []

  - id: pce
    keyword: PCE 물가지수
    subtitle: 연준이 CPI보다 더 본다는 물가 지표
    angle: PCE와 근원 PCE의 뜻, CPI와 무엇이 다른지(조사 대상과 가중치), 연준의 물가 목표 2%가 PCE 기준이라는 점, 발표 시기(보통 매달 말, 정확한 날짜는 미국 경제분석국 일정 확인), 시장이 반응하는 방식
    series: [us2y, us10y]
    charts: []

  - id: pmi
    keyword: ISM 제조업 PMI
    subtitle: 50을 넘는지에 시장이 주목하는 이유
    angle: PMI(구매관리자지수)가 무엇을 조사한 숫자인지, 50이 확장과 위축의 기준선이라는 점, 제조업과 서비스업 PMI의 차이, 발표 시기(보통 매달 초, 정확한 날짜는 ISM 일정 확인), 금리와 증시에 주는 영향
    series: [us10y, sp500]
    charts: []

  - id: recession
    keyword: 경기침체 기준
    subtitle: 2분기 연속 역성장이면 침체일까
    angle: 경기침체의 뜻, 흔히 쓰는 '2분기 연속 마이너스 성장' 기준과 미국 전미경제연구소(NBER)의 공식 판단이 다르다는 점, 침체를 미리 알리는 지표들(장단기 금리차, 실업률), 침체 때 주식·채권·달러가 움직이는 경향과 예외
    series: [us10y, us2y, sp500]
    charts: []

  - id: stagflation
    keyword: 스태그플레이션 뜻
    subtitle: 물가는 오르는데 경기는 나쁜 상황
    angle: 스태그플레이션의 뜻(경기 둔화 + 물가 상승), 중앙은행이 금리를 올리기도 내리기도 어려운 이유, 1970년대 사례를 간단히, 인플레이션·디플레이션과의 차이, 주식과 채권에 주는 부담
    series: [wti, us10y]
    charts: []

  - id: qe_qt
    keyword: 양적완화 양적긴축 차이
    subtitle: 연준이 돈을 풀고 거두는 방법
    angle: 양적완화(QE)와 양적긴축(QT)의 뜻, 기준금리 조절과 무엇이 다른지, 연준이 채권을 사고 줄이는 것이 시중 금리와 자산 가격에 주는 영향, 테이퍼링의 뜻. 현재 연준 정책 상태는 단정하지 않고 연준 발표 확인을 권한다
    series: [us10y, us2y]
    charts:
      - {key: us10y, type: line, title: 미 국채 10년 금리 (최근 5년), series: [us10y], days: 1825}

  - id: russell2000
    keyword: 러셀2000 지수
    subtitle: 미국 중소형주 지수가 알려 주는 것
    angle: 러셀2000이 무엇이고 S&P 500과 어떻게 다른지, 중소형주가 금리와 경기에 더 민감한 이유, 대형 기술주와 다르게 움직일 때의 의미(상승세가 넓게 퍼지는지), 지금 수치 해석
    series: [rut, sp500]
    charts:
      - {key: rut, type: line, title: 러셀2000 (최근 5년), series: [rut], days: 1825}

  - id: gold_invest
    keyword: 금 투자 방법
    subtitle: 골드바·금 통장·금 ETF·KRX 금시장 비교
    angle: 금에 투자하는 방법 네 가지(실물, 금 통장, 금 ETF, KRX 금시장)의 차이를 표로, 방법마다 수수료와 세금이 다르다는 점, 금값이 달러 기준이라 환율 영향도 받는다는 점, 지금 금값 수치 해석. 세금·수수료 숫자는 확실한 것만 쓰고 금융회사·국세청 안내 확인을 권한다. 특정 상품을 권하지 않는다
    series: [gold, usdkrw]
    charts:
      - {key: gold, type: line, title: 금 가격 (최근 5년), series: [gold], days: 1825}

  - id: usd_invest
    keyword: 달러 투자 방법
    subtitle: 외화예금·달러 ETF·환전, 무엇이 다를까
    angle: 달러를 사 두는 방법(환전, 외화예금, 달러 ETF, 미국 주식·채권)의 차이를 표로, 환전 수수료(스프레드)와 환율 우대의 뜻, 환차익을 노릴 때의 위험, 지금 환율 수치 해석. 수수료·세금 숫자는 금융회사마다 다르므로 확인을 권한다. 특정 상품을 권하지 않는다
    series: [usdkrw, dxy]
    charts:
      - {key: usdkrw, type: line, title: 원/달러 환율 (최근 5년), series: [usdkrw], days: 1825}
