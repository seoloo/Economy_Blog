# 파이프라인 동작 설정. 비밀값은 여기 두지 않는다 (.env / GitHub Secrets).

timezone: Asia/Seoul
output_dir: output
blog_name: 오늘의 경제 시황

collect:
  lookback_hours: 30        # 이 시간 이내에 발행된 기사만 사용
  max_per_source: 30
  timeout_sec: 15

classify:
  provider: laya            # laya | keyword
  fallback: keyword         # provider 실패/키 없음 시 사용
  laya_model: multilingual  # english | multilingual | typed-decisions (한국어 기사 때문에 multilingual)
  laya_min_confidence: 0.3  # 주제 판정 확신도가 이보다 낮으면 other 로 처리
  laya_weight: 0.7          # 최종 중요도 = Laya 0.7 + 시장 키워드 점수 0.3
  top_n_per_region: 8       # 국내/해외 각각 글쓰기에 넘길 기사 수
  dedupe_threshold: 0.55    # 제목 유사도 이상이면 중복으로 처리
  topics:                   # id: 설명 (Laya choice 기준이자 키워드 분류 라벨)
    rates: 금리, 중앙은행, 통화정책, 채권
    fx: 환율, 달러, 원화, 외환
    equity: 주식시장, 증시, 지수, 투자심리
    tech: 반도체, AI, 빅테크, 기술주
    macro: 물가, 고용, 성장률, 경기지표
    trade: 무역, 관세, 지정학, 공급망
    energy: 유가, 원자재, 금, 에너지
    realestate: 부동산, 주택, 가계부채
    earnings: 기업 실적, 가이던스, 개별 기업
    crypto: 비트코인, 가상자산
    other: 기타

market:
  lookback_days: 200

# 차트는 type(빌더 종류)만 맞으면 설정 추가만으로 늘릴 수 있다.
#  position: cover = 글 맨 위 대표 이미지, lead = '오늘 시장 한눈에' 아래, body = '차트로 보는 주요 지표' (기본값)
charts:
  - key: cover
    type: cover
    title: 대표 이미지
    series: [sp500, nasdaq, kospi, usdkrw]
    position: cover
  - key: index_change
    type: change_bar
    title: 주요 지수 전일 대비 등락률
    series: [kospi, kosdaq, sp500, nasdaq, dow, nikkei]
    position: lead
  - key: usdkrw
    type: line
    title: 원/달러 환율 추이 (최근 3개월)
    series: [usdkrw]
    days: 90
  - key: us_rates
    type: spread
    title: 미 국채 10년·2년 금리와 장단기 금리차
    series: [us10y, us2y]
    days: 180

write:
  provider: claude          # claude | template
  fallback: template
  model: claude-opus-5-5
  effort: medium            # low | medium | high
  max_tokens: 16000

# 글 구성. 표·요약 상자의 수치는 시장 데이터로 바로 채운다 (LLM 이 수치를 만들지 않도록).
post:
  series_title: 미국증시·코스피 시황   # 제목 형식: <series_title> | 11월 7일(토) | 핵심 한 줄
  glance: [sp500, nasdaq, kospi, kosdaq, usdkrw, us10y, wti, gold]   # 2열 카드라 짝수가 보기 좋다
  global_table: [sp500, nasdaq, dow, nikkei, us10y, us2y, dxy, wti, gold]
  korea_table: [kospi, kosdaq, usdkrw, kr3y, kr_base_rate]

# 차트 PNG 를 공개 레포에 올려 post.html 에 이미지 주소를 바로 넣는다 (붙여넣기 한 번으로 끝).
# CHARTS_REPO_TOKEN 이 없으면 올리지 않고, 본문에 [이미지 삽입] 안내 상자가 들어간다.
publish:
  repo: seoloo/econblog-assets
  branch: main
  base_url: https://seoloo.github.io/econblog-assets

guard:
  max_shared_chars: 40
  # AI 가 쓴 티가 나는 표현: 글 한 편에서 허용 횟수 (넘으면 메일에 경고)
  ai_phrases:
    "로 보입니다": 2
    "수 있습니다": 4
    "셈입니다": 1
    "결국": 1
    "이른바": 0
    "주목할 만": 0
    "눈여겨볼": 0
    "살펴보겠습니다": 0
    "알아보겠습니다": 0
    "종합하면": 0
    "결론적으로": 0
    "시사합니다": 0
    "귀추가 주목": 0
    "라는 점에서": 1
    "중요한 의미": 0
    "—": 0      # 출처와 연속으로 겹치는 글자 수 상한 (넘으면 경고)

deliver:
  methods: [local, email]   # local: output/ 저장, email: 메일 발송 (설정 없으면 건너뜀)
