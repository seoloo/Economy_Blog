# 파이프라인 동작 설정. 비밀값은 여기 두지 않는다 (.env / GitHub Secrets).

timezone: Asia/Seoul
output_dir: output
blog_name: 그냥모아
# 글 맨 위 대표 이미지(카테고리별 고정 썸네일, assets/brand/make_thumbnails.py 로 만든다).
# 항목을 지우면 그 글은 예전처럼 데이터로 표지를 그린다.
thumbnails:
  daily: assets/brand/thumb_market.jpg   # 시황
  guide: assets/brand/thumb_study.jpg    # 경제 공부

collect:
  lookback_hours: 30        # 이 시간 이내에 발행된 기사만 사용
  max_per_source: 30
  timeout_sec: 15

classify:
  provider: laya            # laya | keyword
  fallback: keyword         # provider 실패/키 없음 시 사용
  laya_model: multilingual  # english | multilingual | typed-decisions (한국어 기사 때문에 multilingual)
  laya_min_confidence: 0.3  # 주제 판정 확신도가 이보다 낮으면 other 로 처리
  laya_weight: 0.7          # 최종 중요도 = Laya 0.7 + 시장 키워드 점수 0.3
  top_n_per_region: 8       # 국내/해외 각각 글쓰기에 넘길 기사 수
  dedupe_threshold: 0.55    # 제목 유사도 이상이면 중복으로 처리
  topics:                   # id: 설명 (Laya choice 기준이자 키워드 분류 라벨)
    rates: 금리, 중앙은행, 통화정책, 채권
    fx: 환율, 달러, 원화, 외환
    equity: 주식시장, 증시, 지수, 투자심리
    tech: 반도체, AI, 빅테크, 기술주
    macro: 물가, 고용, 성장률, 경기지표
    trade: 무역, 관세, 지정학, 공급망
    energy: 유가, 원자재, 금, 에너지
    realestate: 부동산, 주택, 가계부채
    earnings: 기업 실적, 가이던스, 개별 기업
    crypto: 비트코인, 가상자산
    other: 기타

market:
  lookback_days: 200

# 차트는 type(빌더 종류)만 맞으면 설정 추가만으로 늘릴 수 있다.
#  position: cover = 글 맨 위 대표 이미지, lead = '오늘 시장 한눈에' 아래, body = '차트로 보는 주요 지표' (기본값)
charts:
  - key: cover
    type: cover
    title: 대표 이미지
    series: [sp500, nasdaq, kospi, usdkrw]
    position: cover
  - key: index_change
    type: change_bar
    title: 주요 지수 전일 대비 등락률
    series: [kospi, kosdaq, sp500, nasdaq, dow, nikkei]
    position: lead
  - key: usdkrw
    type: line
    title: 원/달러 환율 추이 (최근 3개월)
    series: [usdkrw]
    days: 90
  - key: us_rates
    type: spread
    title: 미 국채 10년·2년 금리와 장단기 금리차
    series: [us10y, us2y]
    days: 180

write:
  provider: claude          # claude | template
  fallback: template
  model: claude-opus-5-5
  effort: medium            # low | medium | high
  max_tokens: 16000

# 글 구성. 표·요약 상자의 수치는 시장 데이터로 바로 채운다 (LLM 이 수치를 만들지 않도록).
post:
  series_title: 미국증시·코스피 시황   # 제목 형식: <series_title> | 11월 7일(토) | 핵심 한 줄
  glance: [sp500, nasdaq, kospi, kosdaq, usdkrw, us10y, wti, gold]   # 2열 카드라 짝수가 보기 좋다
  global_table: [sp500, nasdaq, dow, nikkei, us10y, us2y, dxy, wti, gold]
  korea_table: [kospi, kosdaq, usdkrw, kr3y, kr_base_rate]

# 경제 공부 글 (config/guides.yaml 주제를 순서대로). 자동 실행일마다 다음 주제로 넘어간다.
guide:
  weekdays: [2, 5]          # 수·토 (0=월). 워크플로 cron 과 맞춘다
  start_date: 2026-11-11    # 이 날짜부터 실행일을 센다
  start_index: 5            # 수동으로 먼저 만든 편수만큼 올린다 (11/8 앞 5편 미리 작성)
  lookback_days: 1900       # 장기 차트용 데이터 기간 (약 5년)

# 차트 PNG 를 공개 레포에 올려 post.html 에 이미지 주소를 바로 넣는다 (붙여넣기 한 번으로 끝).
# CHARTS_REPO_TOKEN 이 없으면 올리지 않고, 본문에 [이미지 삽입] 안내 상자가 들어간다.
publish:
  repo: seoloo/econblog-assets
  branch: main
  base_url: https://seoloo.github.io/econblog-assets

guard:
  max_shared_chars: 40
  # AI 가 쓴 티가 나는 표현: 글 한 편에서 허용 횟수 (넘으면 메일에 경고)
  ai_phrases:
    "로 보입니다": 2
    "수 있습니다": 4
    "셈입니다": 1
    "결국": 1
    "이른바": 0
    "주목할 만": 0
    "눈여겨볼": 0
    "살펴보겠습니다": 0
    "알아보겠습니다": 0
    "종합하면": 0
    "결론적으로": 0
    "시사합니다": 0
    "귀추가 주목": 0
    "라는 점에서": 1
    "중요한 의미": 0
    "지수보다 환율 쪽이 더 신경": 0   # 말투 규칙의 옛 예시 문장 (그대로 베끼면 경고)
    "—": 0      # 출처와 연속으로 겹치는 글자 수 상한 (넘으면 경고)

deliver:
  methods: [local, email]   # local: output/ 저장, email: 메일 발송 (설정 없으면 건너뜀)

# 인스타 카드뉴스. 시황 글과 같은 실행에서 계정마다 카드 묶음을 만들어 메일로 보낸다.
#  publish: true 로 바꾸면 토큰이 있는 계정에 바로 게시한다 (처음 1~2주는 false 로 두고 메일로 확인).
#  slides 순서: cover 표지, board 숫자판, story 이슈(두 번), sectors 미국 업종, movers 미국 대형주,
#               check 아시아·한국 체크, events 일정(없으면 빠짐), closing 오늘의 한 줄
instagram:
  enabled: true
  publish: true        # 경고가 없는 날만 자동 게시 (경고가 있으면 메일로만 보내고 insta-edit/insta-post 로 올린다)
  publish_weekdays: [1, 2, 3, 4, 5]   # 화~토(0=월). 정기 실행도 화~토. 월요일에 손으로 돌려도 게시하지 않는다
  disclaimer: false    # true 면 캡션 끝·마지막 카드 아래에 "투자 권유 아님" 문구를 넣는다 (블로그 글에는 항상 들어감)
  graph_version: v23.0
  # 릴스: 그날 카드 내용으로 세로(9:16) 장면 6개(훅·숫자·이슈 2·다음에 볼 것·끝)를 그려 캐러셀과 같이 올린다. 릴스 탭에만 보이고 프로필 격자에는 안 쌓인다.
  # 음악은 Pixabay 무료 음원(상업적 사용 가능, 출처 표기 의무 없음) 중 Content ID 에 등록되지 않은 곡만 날짜별로 돌려 쓴다.
  # 음원 파일은 레포에 올리지 않고 실행할 때 내려받는다 (Pixabay 라이선스는 음원 파일 자체의 재배포를 막는다).
  reels:
    enabled: true
    share_to_feed: false
    music:
      - {title: "Financial News", artist: "Kulakovka", page: "https://pixabay.com/music/adventure-financial-news-614884/", url: "https://cdn.pixabay.com/download/audio/2026/10/04/audio_731a75b21c.mp3?filename=kulakovka-financial-news-614884.mp3"}
      - {title: "News", artist: "Monume", page: "https://pixabay.com/music/beats-news-603976/", url: "https://cdn.pixabay.com/download/audio/2026/09/15/audio_9345babe94.mp3?filename=monume-news-603976.mp3"}
      - {title: "Business", artist: "Sub_Clair", page: "https://pixabay.com/music/corporate-business-571900/", url: "https://cdn.pixabay.com/download/audio/2026/07/22/audio_033eb15d5b.mp3?filename=sub_clair-business-571900.mp3"}
      - {title: "Corporate Ambient", artist: "AtlasAudio", page: "https://pixabay.com/music/corporate-corporate-ambient-625699/", url: "https://cdn.pixabay.com/download/audio/2026/10/23/audio_f62c992948.mp3?filename=atlasaudio-corporate-ambient-625699.mp3"}
      - {title: "Corporate Marimba Business Background", artist: "alex-morgan", page: "https://pixabay.com/music/corporate-corporate-marimba-business-background-563569/", url: "https://cdn.pixabay.com/download/audio/2026/07/13/audio_489c65770f.mp3?filename=alex-morgan-corporate-marimba-business-background-563569.mp3"}
      - {title: "Cinematic Corporate", artist: "alex-morgan", page: "https://pixabay.com/music/corporate-cinematic-corporate-556231/", url: "https://cdn.pixabay.com/download/audio/2026/06/23/audio_506b25c5cd.mp3?filename=alex-morgan-cinematic-corporate-556231.mp3"}
  # 카드에 쓰면 안 되는 모호한 표현. 나오면 [검토] 경고를 붙인다 (도시 이름으로 시장 부르기, 비유, 막연한 예측).
  vague_phrases:
    ko: ["서울은", "뉴욕은", "도쿄는", "월가는", "어디쯤", "온도차", "온도 차", "정반대의 하루", "웃었다", "울었다", "지켜볼 일", "일 겁니다"]
    en: ["Seoul sold", "New York bought", "Wall Street shrugged", "far from settled", "somewhere in between", "remains to be seen", "only time will tell", "rages on"]
  # 개인 의혹·소문처럼 사람이 사실을 확인해야 하는 표현. 나오면 [검토] 경고를 붙여 그날은 자동 게시하지 않는다.
  sensitive_phrases:
    ko: ["의혹", "스캔들", "불륜", "스파이", "간첩", "루머", "소문", "사생활", "혐의", "고발", "고소", "기소", "구속"]
    en: ["allegation", "alleged", "scandal", "affair", "spy", "rumor", "rumour", "private life", "indicted", "lawsuit", "accused"]
  accounts:
    - key: kr
      lang: ko
      brand: 그냥모아
      brand_dot: "."
      token_env: INSTAGRAM_ACCESS_TOKEN
      user_env: INSTAGRAM_USER_ID
      slides: [cover, board, story, story, sectors, movers, events, closing]
      chips: [kospi, nasdaq, usdkrw]
      board: [kospi, kosdaq, sp500, nasdaq, dow, nikkei, usdkrw, us10y, wti, gold]
    - key: en
      lang: en
      brand: 4PM RECAP
      token_env: INSTAGRAM_EN_ACCESS_TOKEN
      user_env: INSTAGRAM_EN_USER_ID
      slides: [cover, board, sectors, movers, story, story, check, korea, events, closing]   # 인스타 캐러셀 최대 10장
      chips: [sp500, nasdaq, dow]
      board: [sp500, nasdaq, dow, rut, sox, vix, us10y, dxy, wti, btc]
      check: [kospi, nikkei, st_hynix, st_samsung, usdkrw]
