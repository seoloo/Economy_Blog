# 인스타 계정 소개 게시물 (프로필 맨 위에 고정해 두는 용도). python -m econblog insta-intro 로 만든다.
# 카드 예시 그림은 실제로 올린 카드 묶음(--examples)에서 가져온다. shots 는 그 묶음의 카드 번호(1부터).
#
# 말투: 친구한테 말하듯 짧은 해요체. 문장을 짧게 끊고, 장마다 두 문단씩 반듯하게 맞추지 않는다.
# 가장 중요: 뜬금없는 말 금지. "숫자는 손으로 안 옮겨요", "성적표", "깎아 먹었다"처럼 앞뒤 없이 튀어나와
# 뜻이 바로 안 읽히는 문장·비유·말장난을 쓰지 않는다. 처음 보는 사람이 글자 그대로 읽어도 알아듣게 쓴다.
# 그 밖에 쓰지 않는 것: "~드립니다/~하셔야 해요/~해 보세요" 같은 안내·홍보 말투, 점 목록,
# 저장·팔로우 권유, 확인 안 된 개인사(직업 등) 지어내기.

kr:
  caption: |
    처음 오신 분들 위해서 카드 보는 법 한 번 정리해 놨어요.

    매일 아침 올리는 카드 8장, 순서대로 뭐가 들어 있는지만 보면 돼요. 예시는 {example_date}에 올린 카드예요.

    월~토 아침에 올라오고 일요일은 쉬어요.
  hashtags: [그냥모아, 경제카드뉴스, 아침시황, 미국증시, 코스피, 나스닥, 환율, 주식공부]
  slides:
    - kind: cover
      kicker: 처음 오셨으면
      lines: ["매일 아침 카드", "보는 법"]
      shots: [2, 1, 5]

    - kind: text
      kicker: 그냥모아는
      title: 아침마다 시황 카드 올려요
      paras:
        - 아침에 미국장 어떻게 끝났는지, 코스피는 왜 그렇게 움직였는지. 기사 열 개씩 찾아보기 귀찮잖아요.
        - 그래서 그냥 한데 모았어요. **카드 8장.** 넘기는 데 1분이면 돼요.
      box_label: 올라오는 날
      box: 월~토 아침. 일요일은 장이 없어서 쉬어요.

    - kind: shots
      kicker: 1~2장
      title: 표지랑 오늘 시장 한눈에
      shots: [1, 2]
      paras:
        - 표지엔 그날 제일 크게 움직인 거 딱 두 줄. 밑에 작은 숫자 3개는 코스피, 나스닥, 환율이 얼마나 움직였는지예요.
        - 두 번째 장은 지수랑 환율, 금리, 유가, 금까지 10개를 한 장에 모은 거예요. **빨간 건 오른 거, 파란 건 내린 거.**

    - kind: shots
      kicker: 3~4장
      title: 그날 이슈 두 개
      shots: [3, 4]
      paras:
        - 숫자만 보면 왜 그런지 모르잖아요. 그날 시장 흔든 얘기 두 개만 골라서 풀어요.
        - 밑에 **'왜 중요할까'**는 이 일이 앞으로 시장에 어떤 영향을 줄지 한 줄로 적은 거예요.

    - kind: shots
      kicker: 5~6장
      title: 미국 업종이랑 대형주
      shots: [5, 6]
      paras:
        - 왼쪽은 미국 업종 11개가 하루 동안 얼마나 움직였는지예요. 색이 진할수록 많이 움직인 거예요.
        - 오른쪽은 애플, 엔비디아 같은 대형주 12개를 많이 오른 순서로 세운 거예요. **어떤 종목이 시장을 끌어올리고 어떤 종목이 끌어내렸는지** 바로 보여요.

    - kind: shots
      kicker: 7~8장
      title: 일정이랑 체크리스트
      shots: [7, 8]
      paras:
        - 왼쪽은 이번 주 일정. 물가 지표, 실적 발표 같은 거요.
        - 마지막 카드는 다음 거래일에 체크할 세 가지예요.
        - "**노란 숫자가 직전 거래일 마감 값**이라 장 열리면 그 숫자랑 비교해 보면 돼요."

    - kind: end
      kicker: 참고로
      title: 숫자는 어디서 오냐면
      paras:
        - 카드에 나오는 지수, 환율, 주가는 전부 Yahoo Finance 마감 데이터예요.
        - 사람이 하나하나 옮겨 적지 않고 데이터를 그대로 가져와서 넣어요.
        - 사진은 Pixabay 무료 사진 써요.
        - 그리고 이건 그냥 정리예요. 사라, 팔아라 하는 거 아니에요.
