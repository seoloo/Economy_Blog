# 인스타 계정 소개 게시물 (프로필 맨 위에 고정해 두는 용도). python -m econblog insta-intro 로 만든다.
# 카드 예시 그림은 실제로 올린 카드 묶음(--examples)에서 가져온다. shots 는 그 묶음의 카드 번호(1부터).
#
# 말투: 국내 경제 인스타(서울경제·한국경제·에크케 등)가 쓰는 "~임/~함" 요약체. 한 줄에 한 가지만, 짧게 끊는다.
# 쓰지 않는 것: "~해 보세요/만나 보세요/도와드립니다" 같은 홍보 말투, 멋 부린 제목, 저장·팔로우 권유,
# 확인 안 된 개인사(직업 등) 지어내기.

kr:
  caption: |
    📌 처음 왔다면 이것부터
    매일 아침 올라오는 카드 8장, 뭘 보면 되는지 정리해 둠

    1~2장 표지랑 숫자판
    3~4장 그날 시장 흔든 얘기 2개
    5~6장 미국 업종이랑 대형주
    7~8장 앞으로 볼 일정이랑 체크리스트

    예시는 {example_date}에 올린 카드
    월~토 아침에 올라오고 일요일은 쉼
  hashtags: [그냥모아, 경제카드뉴스, 아침시황, 미국증시, 코스피, 나스닥, 환율, 주식공부]
  slides:
    - kind: cover
      kicker: 처음 왔다면
      lines: ["카드 8장,", "이 순서로 보면 됨"]
      shots: [2, 1, 5]

    - kind: text
      kicker: 그냥모아
      title: 아침에 1분이면 끝
      paras:
        - 밤사이 미국장 어땠는지, 코스피는 왜 또 저러는지
        - 기사 10개 뒤질 필요 없게 **카드 8장에 그냥 모아 둠**
        - 숫자는 전부 마감 데이터 그대로 가져옴
      box_label: 올라오는 날
      box: 월~토 아침. 일요일은 장이 없어서 쉼

    - kind: shots
      kicker: 1~2장
      title: 표지랑 숫자판
      shots: [1, 2]
      paras:
        - "표지: 그날 제일 크게 움직인 거 두 줄. 밑에 칩 3개는 코스피·나스닥·환율"
        - "숫자판: 지수 6개에 환율·금리·유가·금까지 10개. **빨강은 오름, 파랑은 내림**"

    - kind: shots
      kicker: 3~4장
      title: 오늘 무슨 일이었냐면
      shots: [3, 4]
      paras:
        - 숫자만 보면 왜 그런지 모름. 그래서 그날 시장 흔든 얘기 딱 2개만 골라서 정리함
        - "맨 아래 **'왜 중요할까'** = 그래서 나랑 무슨 상관인지 한 줄 요약"

    - kind: shots
      kicker: 5~6장
      title: 미국 업종이랑 대형주
      shots: [5, 6]
      paras:
        - "왼쪽: 미국 업종 11개 성적표. 색 진할수록 많이 움직인 거"
        - "오른쪽: 애플·엔비디아 같은 대형주 12개 줄 세운 거. 그날 **누가 끌고 누가 깎아 먹었는지** 바로 보임"

    - kind: shots
      kicker: 7~8장
      title: 앞으로 볼 거
      shots: [7, 8]
      paras:
        - "왼쪽: 이번 주 일정. 물가 지표, 실적 발표 같은 거"
        - "마지막 장: 다음 장 열리면 체크할 3가지"
        - "**노란 숫자는 직전 마감 값.** 장중에 비교하기 좋음"

    - kind: end
      kicker: 참고로
      title: 숫자는 손 안 댐
      paras:
        - Yahoo Finance 마감 데이터 그대로 끌어옴
        - 옮겨 치다 오타 낼 일 없음
        - 사진은 Pixabay 무료 사진
        - 그리고 이건 그냥 정리임. 사라, 팔아라 하는 거 아님
