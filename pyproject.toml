[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "econblog"
version = "0.1.0"
description = "매일 경제 시황 블로그 초안과 차트를 만드는 파이프라인"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.70",
    "feedparser>=6.0",
    "jinja2>=3.1",
    "matplotlib>=3.8",
    "pillow>=10.0",
    "pydantic>=2.6",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "requests>=2.31",
    "yfinance>=0.2.50",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
econblog = "econblog.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
